<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mi Juego 3D</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#999;touch-action:none;user-select:none;-webkit-user-select:none;font:700 11px sans-serif}
.b{position:fixed;border-radius:50%;background:#fff4;border:2px solid #fffa;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;z-index:5;text-shadow:0 0 3px #000}
.b.on{background:#4af9}
#ju{right:24px;bottom:26px;width:78px;height:78px}#ag{right:112px;bottom:26px;width:60px;height:60px}
#ac{right:112px;bottom:96px;width:60px;height:60px}#co{right:24px;bottom:116px;width:60px;height:60px}
#ul{right:24px;bottom:186px;width:82px;height:82px;background:#a2f9;border-color:#fdf;font-size:13px}
#jb{position:fixed;display:none;width:100px;height:100px;border-radius:50%;background:#fff3;border:2px solid #fff7;z-index:4}
#jk{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:#fffa}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
</style></head><body>
<script>window.onerror=function(m,s,l){var d=document.createElement('div');d.style.cssText='position:fixed;top:0;left:0;right:0;background:#900;color:#fff;font:12px sans-serif;padding:8px;z-index:99';d.textContent='ERROR: '+m+' (linea '+l+')';document.body.appendChild(d)}</script>
<div id="jb"><div id="jk"></div></div><div id="fl"></div>
<div id="ju" class="b">SALTAR</div><div id="ag" class="b">AGACHAR</div><div id="ac" class="b">ACOSTAR</div><div id="co" class="b">CORRER</div><div id="ul" class="b">ULTI</div>
<script src="game.js"></script></body></html>
